version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       etikbulmuyorum
      POSTGRES_USER:     etikuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etikuser -d etikbulmuyorum"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:                production
      PORT:                    4000
      DATABASE_URL:            postgresql://etikuser:${POSTGRES_PASSWORD}@postgres:5432/etikbulmuyorum
      JWT_SECRET:              ${JWT_SECRET}
      REFRESH_TOKEN_SECRET:    ${REFRESH_TOKEN_SECRET}
      JWT_EXPIRES_IN:          15m
      REFRESH_TOKEN_EXPIRES_IN: 30d
      GOOGLE_CLIENT_ID:        ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET:    ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL:            https://etikbulmuyorum.com
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL:          /api
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
